name: daily-factory

on:
  schedule:
    # The cycle runs at 22:00 Cairo (19:00 UTC), two hours before the
    # first Short of the day goes public at midnight Cairo. The external
    # pinger fires at 19:00 UTC; these GitHub slots are the backup ring
    # around it, plus morning-after recovery slots (a fully-missed
    # evening still catches the day's later slots). The gate job makes
    # every extra fire cost ~15 seconds and ZERO quota: the first
    # successful trigger produces, the rest SKIP instantly.
    - cron: "11 19 * * *"   # 22:11 Cairo — backup for the pinger
    - cron: "23 19 * * *"
    - cron: "41 19 * * *"
    - cron: "13 20 * * *"
    - cron: "19 21 * * *"   # 00:19 Cairo — grid already rolling
    - cron: "31 22 * * *"   # 01:31 Cairo — last same-evening chance
    - cron: "37 23 * * *"
    - cron: "23 5 * * *"    # 08:23 Cairo — morning-after recovery
    - cron: "29 12 * * *"   # 15:29 Cairo — midday recovery
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Produce videos and print the upload plan without uploading"
        type: boolean
        default: false
      backfill_only:
        description: "Only set missing custom thumbnails (no new episodes)"
        type: boolean
        default: false
      gated:
        description: "Respect the daily gate (default ON: API dispatches like the external pinger or watchdog are quota-safe; untick only to force a re-run of an already-produced day)"
        type: boolean
        default: true

permissions:
  contents: write   # commit the factory memory (data/state.json)
  issues: write     # auto-open an Issue if the day fails

# Workflow-level: a queued duplicate waits for the WHOLE run (gate
# included), so it re-reads the fresh state and SKIPs cheaply instead
# of double-rendering the day.
concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout
        # ref:main, NOT the event's pinned SHA — a run promoted out of
        # the concurrency queue may carry a SHA from BEFORE the racing
        # run pushed its memory. Reading the pinned SHA made this gate
        # re-read stale state and double-produce the day (Oct 3 race:
        # dispatch + a delayed cron slot both rendered ep13). Fresh
        # HEAD = the stamp the finished run just pushed = a clean SKIP.
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Has today's cycle already run?
        id: gate
        run: |
          if [ "${{ inputs.backfill_only }}" = "true" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "explicit mode (backfill/dry-run) - gate bypassed"
            exit 0
          fi
          EVENT="${{ github.event_name }}"
          if [ "${{ inputs.gated }}" = "true" ]; then
            # watchdog dispatch: subject to the state gate, never a free pass
            EVENT="schedule"
          fi
          VERDICT=$(python tools/gate.py --event "$EVENT" --actor "${{ github.actor }}")
          echo "$VERDICT"
          case "$VERDICT" in
            RUN*) echo "run=true"  >> "$GITHUB_OUTPUT" ;;
            *)    echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build-and-publish:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        # ref:main — same reasoning as the gate job: always render
        # from the freshest state (a crash-resume must see the
        # in-progress episode the previous run recorded).
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Ensure ffmpeg
        run: |
          if ! which ffmpeg; then
            # Oct 7 19:00 UTC run: apt stalled for 25+ minutes on a
            # slow mirror and would have burned the full 120-min job
            # timeout. Fail fast instead — the alert fires, the next
            # slot retries on a fresh runner. (A normal install is
            # ~60-90s; these budgets are generous by comparison.)
            sudo timeout 300 apt-get update -qq
            sudo timeout 480 apt-get install -y -qq ffmpeg
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the factory
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -o pipefail   # a python failure must fail the workflow (and fire the alert), not be swallowed by tee
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          MODE=""
          if [ "${{ inputs.backfill_only }}" = "true" ]; then MODE="--backfill-thumbs"; fi
          python main.py $DRY $MODE 2>&1 | tee factory.log
          # a deferred day must be visible in the run summary too
          if grep -q 'uploads deferred' factory.log; then
            echo "::warning::this cycle deferred its uploads (quota) — see factory.log"
          fi

      - name: Commit the factory memory
        if: always()
        run: |
          git config user.name "psychlove-factory"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json factory.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing new to remember"
          else
            NOTE=$(python3 tools/defer_note.py 2>/dev/null || true)
            git commit -m "factory memory: $(date -u +%F) cycle${NOTE}"
            # The remote may have advanced while this run was rendering
            # (manual pushes, web edits). Rebase first so the memory
            # commit always lands cleanly — never a non-fast-forward.
            git fetch origin main
            if git rebase --autostash origin/main; then
              git push origin main
            else
              # Another run advanced main underneath us (e.g. a racing
              # run that pushed its memory first). Its memory wins —
              # ours is the redundant copy of the same work. Dropping
              # it is strictly safer than force-applying stale state:
              # a lost last_run_ts stamp would double-produce tomorrow.
              git rebase --abort 2>/dev/null || true
              echo "memory push skipped: main advanced mid-run — the other run's memory wins"
            fi
          fi

      - name: Alert on failure
        if: failure()
        run: |
          TITLE="Factory cycle failed — $(date -u +%F)"
          # One issue per failure-day, not one per retry slot: a bad
          # evening can fire many slots and issue-spam hides the real
          # signal. The next run's comment/run link still tells the story.
          DUPES=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$DUPES" != "0" ]; then
            echo "an open failure issue for today already exists — not filing a duplicate"
            exit 0
          fi
          BODY=$(printf 'The daily run failed. Logs are committed as factory.log.\n\nThe next scheduled run retries automatically (episodes resume).\n\nSee the run: %s/actions/runs/%s\n\n- auto-filed by the factory' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh issue create --title "$TITLE" --body "$BODY" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
