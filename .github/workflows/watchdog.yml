name: watchdog

# The scheduler bodyguard. The external pinger fires at 19:00 UTC
# (22:00 Cairo) and daily-factory carries 9 of its own staggered
# slots — this workflow adds MORE independent chances, concentrated
# right after the cycle window and in the morning-after recovery
# zone. Each heartbeat asks the same 20h-window gate: "did the
# factory produce recently?" If not, it DISPATCHES daily-factory
# immediately (workflow_dispatch events skip the starved schedule
# queue). The gate + factory concurrency group make double fires
# free (SKIP) and safe (queue, never overlap).
on:
  schedule:
    - cron: "49 19-23 * * *"   # 19:49-23:49 UTC — post-cycle window
    - cron: "23 5,8,11,14 * * *"  # morning/afternoon recovery beats
  workflow_dispatch:

permissions:
  actions: write   # kick daily-factory via GITHUB_TOKEN
  contents: read
  issues: write    # alert when the watchdog ITSELF fails (Oct 8 audit)

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    # 5 -> 10 min: pure headroom for slow runners/checkouts.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Does today still need a cycle?
        id: gate
        run: |
          # python3 (survives future runner images); a gate.py crash
          # defaults to RUN here too — the kick is then gated again by
          # daily-factory's own gate, so a broken gate can never stop
          # the loop silently.
          VERDICT=$(python3 tools/gate.py --event schedule --actor watchdog || echo "RUN   # gate.py did not even run — kicking the factory anyway")
          echo "$VERDICT"
          case "$VERDICT" in
            RUN*) echo "run=true"  >> "$GITHUB_OUTPUT" ;;
            *)    echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Kick the factory
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "factory has not produced today — dispatching daily-factory"
          gh workflow run daily-factory.yml --ref main -f gated=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: All quiet
        if: steps.gate.outputs.run == 'false'
        run: echo "cycle window satisfied — going back to sleep"

      - name: Alert on watchdog failure
        # If the bodyguard itself breaks (runner, checkout, gh), nobody
        # is watching the watcher. One issue per failure-day, deduped.
        if: failure() || cancelled()
        run: |
          TITLE="Watchdog failed — $(date -u +%F)"
          DUPES=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$DUPES" = "0" ]; then
            gh issue create --title "$TITLE" --body "The watchdog heartbeat job failed — the backup trigger layer is down. The primary pinger and GitHub cron slots still run, but check the run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\n- auto-filed by the factory" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
