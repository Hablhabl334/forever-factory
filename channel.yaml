# ═══════════════════════════════════════════════════════════════════
#  PSYCHOLOGY OF LOVE — the Forever Factory configuration
#  One channel. One machine. Runs daily on GitHub Actions, forever.
#  External services touched: YouTube Data API v3 (upload) + GitHub.
#  Everything else (scripts, art, voice, music) is generated offline.
# ═══════════════════════════════════════════════════════════════════

channel:
  display_name: "Psychology of Love"
  handle: "@PsychologyOfLove"
  niche: love-psychology           # tips, breakups, attraction, self-worth
  audience: "adults interested in relationships, psychology and healing"
  promise: "One real psychology lesson about love every day — plain words, relatable scenes."
  description: >-
    Love psychology explained in plain words. Daily videos about
    attraction, attachment, breakups, and the science of how we love.

schedule:                           # publishAt slots (Africa/Cairo)
  timezone: "Africa/Cairo"
  # The 6-hour shorts grid: a Short goes public every 6 hours, exactly.
  # PUBLIC TIMES — the owner's contract; do not move these. When the
  # machine runs is flexible; when the channel publishes is not.
  short_slots: ["00:00", "06:00", "12:00", "18:00"]
  # The one long-form video of the day, evening prime time.
  long_slots: ["20:00"]
  # The cycle runs at 22:00 Cairo (19:00 UTC) — two hours before the
  # first Short of the new day goes public at midnight.
  # tools/gate.py freezes a copy of this grid (it runs before pip
  # install, so it cannot read YAML) — keep the two in sync.

# Discoverability — shorts carry a FIXED title (the subscription funnel);
# longs are search-first; the playlist is the binge loop.
discovery:
  playlist_title: "Love Psychology Tips 💜"
  playlist_description: >-
    Real psychology about love, attachment and heartbreak — explained
    in plain words. A new lesson every day. Press play and let the
    queue teach you something about your own heart.
  channel_keywords:
    - "psychology of love"
    - "love psychology"
    - "relationship psychology"
    - "relationship tips"
    - "love tips"
    - "breakup advice"
    - "attachment styles"
    - "psychology facts"
    - "self love"
    - "relationship advice"
  channel_description: >-
    Love psychology explained in plain words — attraction, attachment
    styles, breakups, self-worth and the science of how we love. One
    new video every day. Subscribe for more tips like this.

daily:                              # what the factory produces each day
  long_videos: 1                    # ~9-minute psychology deep-dive
  shorts: 4                         # native vertical, every 6 hours
  quota_budget: 10000               # YouTube daily units (default)
  upload_cost_per_video: 1600       # videos.insert cost

story:
  segments: 8                       # psychology concepts per long video
  safety_max_attempts: 8            # audit gate regeneration attempts

voice:
  # ENGINE LADDER (auto): 1) Kokoro-82M — vendored INSIDE this repo
  # (assets/voice_kokoro/), fully local/offline, ~2x realtime CPU,
  # human-class neural voice, MIT license. No API, no key, no network:
  # the voice cannot go dark while the repo exists. 2) edge-tts — free
  # neural backup if the Kokoro files are ever missing. 3) Piper —
  # offline last resort (loudly reported; cycles retry before shipping).
  engine: "auto"
  kokoro_voice: "af_heart"        # the flagship warm neural voice (local)
  kokoro_speed: 0.96              # long videos: calm, intimate delivery
  kokoro_jitter: 4.5              # per-sentence pace jitter (human prosody)
  kokoro_model: "assets/voice_kokoro/kokoro-v1.0.int8.onnx"
  kokoro_voices: "assets/voice_kokoro/voices-v1.0.bin"
  edge_name: "en-US-JennyNeural"  # neural backup (free, no key)
  # 2026-10-13 incident hardening: if the configured voice is refused
  # (retired, throttled), the machine narrates with the first of these
  # that answers — a neural alternate beats an offline downgrade.
  edge_fallback_voices:
    - "en-US-AriaNeural"
    - "en-US-GuyNeural"
    - "en-GB-SoniaNeural"
  # Voice-degraded cycles FAIL (before upload) and the next scheduled
  # slot retries on a fresh runner IP. After this many honest attempts
  # in one day, the day ships with the offline voice instead of going
  # silent — loudly (a voice-degraded Issue is filed).
  max_voice_retries: 4
  edge_rate: "-3%"               # long videos: calm, intimate delivery
  edge_rate_shorts: "-1%"        # shorts: slightly brisker, scroll pace
  edge_pitch: "-2Hz"
  edge_jitter: 4.5               # per-sentence pace jitter (human prosody)
  edge_pitch_jitter: 3.0         # per-sentence pitch drift (human intonation)
  model: "assets/voice/en_US-lessac-medium.onnx"
  length_scale: 1.45                # ≈150 wpm — engaging tips pace
  sentence_pause: 0.42              # seconds between sentences (jittered ±28%)
  paragraph_pause: 0.70             # seconds between scenes (jittered)
  sample_rate: 22050

video:
  width: 1920
  height: 1080
  fps: 30
  overscan: 1.25                    # Ken Burns headroom
  crf: 21
  preset: veryfast
  title_card_seconds: 4             # v4: 6 -> 4 — a 6 s title before a
                                    # spoken word bleeds viewers in 2026
  end_card_seconds: 8               # v4: 12 -> 8 — tighter outro, same message
  # ── v4 THE RETENTION BUILD (2026-10-26): the camera now BREATHES —
  # an eased 5.5% smoothstep Ken Burns across every animated card
  # (world and baked text drift together; burn-in ASS captions stay
  # static because they composite after the drift). The characters
  # still carry the motion budget; the drift is the floor, not the
  # show. "static" freezes the camera exactly as v2.1 did; "kenburns"
  # restores the old linear 7% drift.
  camera: "drift"
  # ARTICULATED CHARACTERS: planted feet with real weight shifts and
  # heel lifts, swinging arms with hands (plus a gentle reach toward
  # the partner), torso lean, breathing, head drifts and nods, living
  # eye gaze, blinks. false = classic whole-sprite sway/bob/blink.
  rig: true

thumbnail:
  # (youtube-thumbnail-design skill, 2026-10-27) The LOCKED couple
  # never changes — only the FACE expression varies per episode,
  # seeded: warm positive expressions read best at phone size
  # (expression CTR table); "inlove" carries double weight as the
  # brand signature. The checklist audit (120px squint test measured,
  # ≤6 promise words, mobile text floor, contrast, <2MB) runs every
  # cycle and is logged — fail-open by design (deterministic renders).
  emotions: ["inlove", "inlove", "happy", "hopeful", "shy"]

shorts:
  width: 1080
  height: 1920
  min_seconds: 45                  # the VOICE must exceed 45s — never silence-padded
  max_seconds: 90                  # owner allows up to 1:30
  count: 4
  fixed_title: "Subscribe for more tips like this"
  fixed_tags: ["#psychology", "#relationship", "#love", "#relationshipgoals"]

music:
  volume_db: -23                    # bed level under the narration
  duck_depth: 0.55                  # how deep the bed dips under speech
  sample_rate: 44100

youtube:
  category_id: "24"                 # Entertainment
  default_language: "en"
  made_for_kids: false              # general-audience relationship content
  synthetic_media_disclosure: true  # honest AI-assistance disclosure
  privacy: "public"                 # final visibility (publishAt schedules it)

  # ── AI-SEO TEXT LAYER (2026-10-27, the ai-seo skill) ─────────────
  # Models don't watch the video — they read the text around it. The
  # narration now ships as a machine-readable English caption track
  # (captions.insert, 50 units) and the long gets a channel summary
  # comment (commentThreads.insert, 50 units): a second liftable text
  # block that seeds the comment section. ~100 units/day on top of
  # the ~8.3k baseline. One structural refusal (400/403) is remembered
  # in state and never retried; transient failures retry next cycle; a
  # failed call costs 0 quota and never blocks a day that shipped.
  # The API cannot pin comments — pin each in Studio if you want (optional).
  text_layer:
    captions: true            # caption track on the long (the transcript)
    captions_shorts: false    # shorts stay quota-lean (flip on later if wanted)
    summary_comment: true     # channel summary comment on the long

  # COMMENTS POLICY — OPEN, by design:
  #   This is NOT child-directed content anymore, so the COPPA comment
  #   freeze no longer applies. With made_for_kids: false, comments
  #   follow the channel's default settings (open for a standard
  #   channel). If any upload ever shows comments off, flip it once:
  #   YouTube Studio → Settings → Community → Defaults → "On".
  #   Comments are the growth engine of this niche — keep them on.
