name: daily-factory

on:
  schedule:
    # GitHub's scheduler is best-effort and starves new repos hard:
    # 2026-09-27, 09-28 AND 09-29 — every scheduled slot was dropped,
    # only manual dispatches ever ran. Two slots were not enough.
    # Strategy: 9 staggered, off-the-hour chances spread across the
    # production window (09:23-20:31 UTC = 12:23-23:31 Cairo). The
    # gate job makes every extra fire cost ~15 seconds and ZERO quota:
    # the first successful trigger produces, the rest SKIP instantly.
    - cron: "23 9 * * *"
    - cron: "41 10 * * *"
    - cron: "07 12 * * *"
    - cron: "29 13 * * *"
    - cron: "53 14 * * *"
    - cron: "11 16 * * *"
    - cron: "37 17 * * *"
    - cron: "03 19 * * *"
    - cron: "31 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Produce videos and print the upload plan without uploading"
        type: boolean
        default: false
      backfill_only:
        description: "Only set missing custom thumbnails (no new episodes)"
        type: boolean
        default: false
      gated:
        description: "Respect the daily gate even though this is a dispatch (set automatically by the watchdog)"
        type: boolean
        default: false

permissions:
  contents: write   # commit the factory memory (data/state.json)
  issues: write     # auto-open an Issue if the day fails

# Workflow-level: a queued duplicate waits for the WHOLE run (gate
# included), so it re-reads the fresh state and SKIPs cheaply instead
# of double-rendering the day.
concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Has today's cycle already run?
        id: gate
        run: |
          if [ "${{ inputs.backfill_only }}" = "true" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "explicit mode (backfill/dry-run) - gate bypassed"
            exit 0
          fi
          EVENT="${{ github.event_name }}"
          if [ "${{ inputs.gated }}" = "true" ]; then
            # watchdog dispatch: subject to the state gate, never a free pass
            EVENT="schedule"
          fi
          VERDICT=$(python tools/gate.py --event "$EVENT" --actor "${{ github.actor }}")
          echo "$VERDICT"
          case "$VERDICT" in
            RUN*) echo "run=true"  >> "$GITHUB_OUTPUT" ;;
            *)    echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build-and-publish:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Ensure ffmpeg
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the factory
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -o pipefail   # a python failure must fail the workflow (and fire the alert), not be swallowed by tee
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          MODE=""
          if [ "${{ inputs.backfill_only }}" = "true" ]; then MODE="--backfill-thumbs"; fi
          python main.py $DRY $MODE 2>&1 | tee factory.log

      - name: Commit the factory memory
        if: always()
        run: |
          git config user.name "moonberry-factory"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json factory.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing new to remember"
          else
            git commit -m "factory memory: $(date -u +%F) cycle"
            # The remote may have advanced while this run was rendering
            # (manual pushes, web edits). Rebase first so the memory
            # commit always lands cleanly — never a non-fast-forward.
            git fetch origin main
            git rebase --autostash origin/main
            git push origin main
          fi

      - name: Alert on failure
        if: failure()
        run: |
          TITLE="Factory cycle failed — $(date -u +%F)"
          BODY=$(printf 'The daily run failed. Logs are committed as factory.log.\n\nThe next scheduled run retries automatically (episodes resume).\n\nSee the run: %s/actions/runs/%s\n\n- auto-filed by the factory' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh issue create --title "$TITLE" --body "$BODY" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
